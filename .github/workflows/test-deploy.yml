name: Test and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      working-directory: ./backend
      continue-on-error: true
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Syntax check
      working-directory: ./backend
      run: |
        python -m py_compile main.py model.py image_processing.py feature_extractors.py
    
    - name: Test imports
      working-directory: ./backend
      run: |
        python -c "import main; import model; import image_processing; import feature_extractors; print('✓ All imports successful')"
    
    - name: Verify model file
      working-directory: ./backend
      run: |
        if [ -f "model.pth" ]; then
          echo "✓ model.pth exists"
        else
          echo "✗ model.pth NOT found - deployment will fail"
          exit 1
        fi

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Render
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "RENDER_DEPLOY_HOOK not set - skipping deployment"
          echo "To enable auto-deploy: Add RENDER_DEPLOY_HOOK secret to GitHub"
        else
          curl "$RENDER_DEPLOY_HOOK"
          echo "Deployment triggered on Render"
        fi
